<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | ApexRow</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0A0A0E">
    <link rel="icon" type="image/svg+xml" href="favicon/favicon.svg">
    <link rel="icon" type="image/png" sizes="96x96" href="favicon/favicon-96x96.png">
    <link rel="icon" type="image/x-icon" href="favicon/favicon.ico">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: radial-gradient(ellipse at top, #1A0507 0%, #0A0A0E 60%);
            color: #FFFFFF;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            line-height: 1.6;
        }
        .card { text-align: center; max-width: 520px; }
        .logo {
            font-family: 'Lilita One', 'Arial Black', sans-serif;
            font-size: 1.6rem;
            margin-bottom: 32px;
            display: inline-block;
        }
        .logo span:last-child { color: #D3122A; }
        .code {
            font-size: clamp(5rem, 18vw, 8rem);
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, #E50914 0%, #7A0016 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }
        h1 { font-size: 1.5rem; margin: 16px 0 8px; }
        p { color: #C2C2C6; font-size: 0.95rem; margin-bottom: 28px; }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #E50914 0%, #D3122A 100%);
            color: #fff;
            text-decoration: none;
            font-weight: 700;
            padding: 13px 28px;
            border-radius: 10px;
            margin: 0 6px 12px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(211, 18, 42, 0.35); }
        .btn-ghost {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: none;
        }
        .btn-ghost:hover { border-color: rgba(211, 18, 42, 0.5); }
        .links { margin-top: 28px; font-size: 0.85rem; color: #8A8A96; }
        .links a { color: #FF5A6E; text-decoration: none; margin: 0 8px; }
        .links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <a href="/" class="logo"><span>Apex</span><span>Row</span></a>
        <div class="code">404</div>
        <h1>Page Not Found</h1>
        <p>The page you're looking for has moved or no longer exists. Let's get you back on track.</p>
        <a href="/" class="btn">Back to Home</a>
        <a href="/#contact" class="btn btn-ghost">Contact Us</a>
        <div class="links">
            <a href="/#services">Services</a>
            <a href="/#clients">Clients</a>
            <a href="mailto:apexrow.lk@gmail.com">apexrow.lk@gmail.com</a>
        </div>
    </div>
</body>
</html>
